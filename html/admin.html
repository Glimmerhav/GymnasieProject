<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <link rel="stylesheet" href="/css/styles-for-index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-styles.css">
</head>

<body>
    <header>
        <h1>Admin - Manage Products</h1>
    </header>

    <section class="admin-content">
        <div id="productListAdmin" class="product-grid"></div>
    </section>

    <button id="addProductButton" class="add-product-button">+</button>

    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeAddProductModal()">&times;</span>
            <form id="productForm" action="/php/upload.php" method="post" enctype="multipart/form-data">
                <label for="productName">Product Name:</label>
                <input type="text" id="productName" name="productName" required>

                <label for="productPrice">Product Price:</label>
                <input type="number" id="productPrice" name="productPrice" required>

                <label for="productDescription">Product Description:</label>
                <textarea id="productDescription" name="productDescription" required></textarea>

                <label for="productStock">Product Stock Quantity:</label>
                <input type="number" id="productStock" name="productStock" required>

                <label for="productImage">Product Image:</label>
                <input type="file" id="productImage" name="productImage" accept="image/*" required>

                <button type="submit">Add Product</button>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>

</html>
